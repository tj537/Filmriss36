[package]
name = "filmriss-app"
description = "Filmriss – camera app with live film simulations"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmriss"

[[bin]]
name = "filmriss"
path = "src/main.rs"

[dependencies]
filmriss-core.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
bytemuck.workspace = true
half.workspace = true
image.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Native cameras (nokhwa) everywhere except Android – a Camera2 backend will follow there.
[target.'cfg(not(target_os = "android"))'.dependencies]
filmriss-camera = { workspace = true, features = ["native"] }

[target.'cfg(target_os = "android")'.dependencies]
filmriss-camera.workspace = true
eframe = { workspace = true, features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
